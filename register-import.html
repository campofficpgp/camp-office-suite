  ROWS.slice(0,12).forEach(function(r){h+='<tr><td>'+r.date+'</td><td>'+r.bench+'</td><td>'+r.serial+'</td><td>'+r.type+'</td><td>'+r.caseNo+'</td><td>'+r.year+'</td><td>'+esc(r.title)+'</td><td>'+esc(r.relief)+'</td><td>'+esc(r.result)+'</td></tr>';});
  $('prev').innerHTML=h;
})();
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

auth.onAuthStateChanged(function(user){
  if(!user){ $('who').innerHTML='<span class="bad">آپ لاگ اِن نہیں ہیں۔</span> پہلے پورٹل (cmpofficepgp.org) پر لاگ اِن کریں، پھر یہ صفحہ دوبارہ کھولیں۔'; return; }
  db.collection('users').doc(user.uid).get().then(function(doc){
    var u=doc.exists?doc.data():{};
    var ok=u.approvalStatus==='approved' && u.isActive!==false;
    var r=u.roleV2||'viewer';
    if(!ok || ['admin','super_admin','data_entry'].indexOf(r)<0){
      $('who').innerHTML='<span class="bad">اس اکاؤنٹ کو اندراج کی اجازت نہیں۔</span>'; return; }
    ME={uid:user.uid,email:user.email,role:r};
    $('who').innerHTML='لاگ اِن: <b dir="ltr">'+esc(user.email)+'</b> ('+r+') — <span class="ok">اندراج کی اجازت ہے</span>';
    prepare();
  }).catch(function(e){ $('who').innerHTML='<span class="bad">جانچ نہیں ہو سکی: '+esc(e.message)+'</span>'; });
});

function prepare(){
  $('plan').hidden=false;
  $('planTxt').textContent='پورٹل میں موجود انٹریاں پڑھ رہا ہوں تاکہ ٹکراؤ جانچ سکوں…';
  db.collection('cases').get().then(function(qs){
    var have={}, haveIds={};
    qs.forEach(function(d){var c=d.data(); haveIds[d.id]=1; have[key(c.type,c.caseNo,c.year,c.date)]=d.id;});
    TODO=[];SKIPPED=[];
    ROWS.forEach(function(r){
      var id='rb_'+r.id;
      if(haveIds[id]){SKIPPED.push([r,'پہلے سے ڈلی ہوئی']);return;}
      if(have[key(r.type,r.caseNo,r.year,r.date)]){SKIPPED.push([r,'اسی کیس کی اسی تاریخ کی انٹری پہلے سے موجود ('+have[key(r.type,r.caseNo,r.year,r.date)]+')']);return;}
      TODO.push(r);
    });
    $('planTxt').innerHTML='پورٹل میں اس وقت کل انٹریاں: <b>'+qs.size+'</b><br>اس فائل میں انٹریاں: <b>'+ROWS.length+'</b> — ڈالنے کے لیے تیار: <b class="ok">'+TODO.length+'</b> — چھوڑی جائیں گی: <b class="'+(SKIPPED.length?'warn':'')+'">'+SKIPPED.length+'</b>';
    SKIPPED.forEach(function(s){log('چھوڑی: '+s[0].id+' '+s[0].type+' '+s[0].caseNo+'/'+s[0].year+' '+s[0].date+' — '+s[1]);});
    $('goBtn').textContent=TODO.length+' انٹریاں ڈال دیں';
    $('goBtn').disabled=TODO.length===0;
  }).catch(function(e){ $('planTxt').innerHTML='<span class="bad">پورٹل کی انٹریاں نہیں پڑھ سکا: '+esc(e.message)+'</span>'; });
}

$('goBtn').onclick=function(){
  if(!ME||!TODO.length) return;
  $('goBtn').disabled=true; $('countBtn').disabled=true;
  var done=0, chunks=[];
  for(var i=0;i<TODO.length;i+=25) chunks.push(TODO.slice(i,i+25));
  function next(ci){
    if(ci>=chunks.length){
      $('status').innerHTML='<b class="ok">مکمل: '+done+' انٹریاں ڈال دی گئیں۔</b>';
      log('مکمل: '+done); $('countBtn').disabled=false; return; }
    var b=db.batch(), now=firebase.firestore.FieldValue.serverTimestamp();
    chunks[ci].forEach(function(r){
      var ref=db.collection('cases').doc('rb_'+r.id);
      b.set(ref,{officer:r.officer,bench:r.bench,serial:r.serial,date:r.date,type:r.type,caseNo:r.caseNo,year:r.year,
        title:r.title,versus:r.versus,nature:r.nature,result:r.result,relief:r.relief,remarks:r.remarks,
        source:SOURCE,sourceRef:r.id,createdBy:ME.email,updatedBy:ME.email,createdAt:now,updatedAt:now});
    });
    b.commit().then(function(){
      done+=chunks[ci].length; $('prog').style.width=Math.round(done/TODO.length*100)+'%';
      $('status').textContent='ڈالی جا چکیں: '+done+' / '+TODO.length; log('گروپ '+(ci+1)+'/'+chunks.length+' ٹھیک');
      next(ci+1);
    }).catch(function(e){
      $('status').innerHTML='<b class="bad">رک گیا: '+esc(e.message)+'</b> — ڈالی جا چکیں: '+done+'۔ صفحہ دوبارہ کھول کر بٹن دبائیں، جو رہ گئی ہیں وہی جائیں گی۔';
      log('خرابی گروپ '+(ci+1)+': '+e.message); $('countBtn').disabled=false;
    });
  }
  next(0);
};
$('countBtn').onclick=function(){
  $('status').textContent='گنتی ہو رہی ہے…';
  db.collection('cases').where('source','==',SOURCE).get().then(function(qs){
    $('status').innerHTML='پورٹل میں اس رجسٹر کی انٹریاں: <b>'+qs.size+'</b> (متوقع 255)'; log('گنتی: '+qs.size);
  }).catch(function(e){ $('status').innerHTML='<span class="bad">'+esc(e.message)+'</span>'; });
};
</script>
