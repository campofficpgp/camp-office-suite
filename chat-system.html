<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Chat — Camp Office PG Punjab</title>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#12203f; --navy2:#1c3363; --navy3:#0b1730;
    --gold:#c8952a; --gold-light:#e8b94f; --gold-deep:#9c7420;
    --bg:#f3f1ea; --card:#ffffff; --border:#e4e0d3; --text:#1c2130; --muted:#666f80;
    --radius:8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,Arial,sans-serif; line-height:1.5;}

  .topbar{background:linear-gradient(135deg,var(--navy2),var(--navy)); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; position:relative; z-index:70;}
  .topbar .brand{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600;}
  .lang-btn{background:var(--gold); color:var(--navy3); border:none; padding:7px 16px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer;}

  .wrap{max-width:760px; margin:0 auto; padding:26px 20px 60px;}
  .note-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:20px; font-size:13px;}
  .note-card b{color:var(--navy);}

  /* ===== Chat launcher (matches the live site's floating chat button) ===== */
  #chatToggleBtn{
    position:fixed; bottom:26px; right:26px; width:56px; height:56px; border-radius:50%;
    background:var(--navy); color:#fff; border:none; font-size:22px; cursor:pointer;
    box-shadow:0 8px 24px rgba(0,0,0,.28); z-index:50; display:flex; align-items:center; justify-content:center;
  }
  #chatToggleBtn:hover{background:var(--navy2);}

  /* ===== Chat panel — same structure as the live Daily Case Management System ===== */
  #chatPanel{
    position:fixed; top:0; right:-340px; width:320px; height:100%; background:#fff;
    box-shadow:-6px 0 24px rgba(0,0,0,.18); display:flex; flex-direction:column;
    transition:right .22s ease; z-index:60; border-left:1px solid var(--border);
  }
  #chatPanel.open{ right:0; }
  .chat-head{background:linear-gradient(135deg,var(--navy2),var(--navy)); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;}
  .chat-head .title{font-size:13.5px; font-weight:700;}
  .chat-head .close{cursor:pointer; font-size:18px; opacity:.85;}

  .chat-messages{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px; display:flex; flex-direction:column; gap:10px; background:#faf9f5;}
  .chat-msg{max-width:88%; position:relative;}
  .chat-msg.me{align-self:flex-end;}
  .chat-msg.them{align-self:flex-start;}
  .chat-msg .sender{font-size:10.5px; color:var(--gold-deep); font-weight:700; margin-bottom:2px;}
  .chat-msg .chat-msg-bubble{background:#fff; border:1px solid var(--border); border-radius:10px; padding:7px 10px; font-size:12.5px; word-break:break-word;}
  .chat-msg.me .chat-msg-bubble{background:var(--navy); color:#fff; border-color:var(--navy);}
  .chat-msg .time{font-size:9.5px; color:var(--muted); margin-top:2px;}
  .chat-msg.me .time{text-align:right;}

  /* Delete control — the piece that was missing on the live chat */
  .chat-msg .delete-btn{
    position:absolute; top:-6px; width:20px; height:20px; border-radius:50%;
    background:#fff; border:1px solid var(--border); color:#a33a3a; font-size:11px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .12s; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .chat-msg.me .delete-btn{ left:-8px; }
  .chat-msg.them .delete-btn{ right:-8px; }
  .chat-msg:hover .delete-btn{ opacity:1; }

  .chat-input-bar{display:flex; flex-direction:column; gap:6px; padding:10px; border-top:1px solid var(--border); position:relative;}
  .chat-toolbar-row{display:flex; gap:6px; align-items:center;}
  .chat-main-row{display:flex; gap:6px; align-items:center;}
  .chat-input-bar input[type="text"]{flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:12.5px; min-width:0;}
  .chat-input-bar button{border:none; background:var(--navy); color:#fff; border-radius:var(--radius); padding:0 14px; cursor:pointer; font-size:12.5px; font-weight:600; flex:none;}
  .chat-input-bar button:hover{background:var(--navy2);}
  .icon-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--navy); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; padding:0 !important;}
  .icon-btn:hover{background:#f2f0e8 !important;}
  .icon-btn.recording{background:#c0392b !important; color:#fff; border-color:#c0392b; animation:pulseRec 1s infinite;}
  .chat-emoji-picker{position:absolute; left:10px; bottom:92px; display:none; grid-template-columns:repeat(8,1fr); gap:4px;
    background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.18); padding:8px;
    max-width:280px; z-index:20;}
  .chat-emoji-picker.open{display:grid;}
  .chat-emoji-picker span{cursor:pointer; font-size:18px; text-align:center; border-radius:6px; padding:2px;}
  .chat-emoji-picker span:hover{background:var(--bg);}
  @keyframes pulseRec{ 0%,100%{ box-shadow:0 0 0 0 rgba(192,57,43,.5); } 50%{ box-shadow:0 0 0 6px rgba(192,57,43,.15); } }

  .chat-msg .chat-msg-bubble a.file-link{display:flex; align-items:center; gap:7px; color:inherit; text-decoration:none;}
  .chat-msg .chat-msg-bubble .file-icon{font-size:18px;}
  .chat-msg .chat-msg-bubble .file-size{font-size:10px; opacity:.75; display:block;}
  .chat-msg .chat-msg-bubble audio{width:190px; height:30px; vertical-align:middle;}
  .chat-msg .chat-msg-bubble .chat-msg-image{max-width:200px; max-height:200px; border-radius:8px; display:block; cursor:pointer; object-fit:cover;}

  [dir="rtl"] #chatPanel{ right:auto; left:-340px; border-left:none; border-right:1px solid var(--border);}
  [dir="rtl"] #chatPanel.open{ left:0; right:auto; }
  [dir="rtl"] #chatToggleBtn{ right:auto; left:26px; }
  [dir="rtl"] .chat-msg.me{ align-self:flex-start; }
  [dir="rtl"] .chat-msg.them{ align-self:flex-end; }
  [dir="rtl"] .chat-msg.me .delete-btn{ left:auto; right:-8px; }
  [dir="rtl"] .chat-msg.them .delete-btn{ right:auto; left:-8px; }
#authGate{ position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px; }
#authGate .gate-card{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:26px 22px; max-width:420px; width:100%; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.06); }
#authGate .gate-card h2{ margin:0 0 8px; font-size:18px; color:var(--navy); }
#authGate .gate-card p{ color:var(--muted); font-size:13.5px; line-height:1.7; margin:6px 0; }
#authGate .gate-card a{ display:inline-block; margin-top:12px; background:var(--navy); color:#fff; padding:9px 18px; border-radius:6px; text-decoration:none; font-size:13.5px; }
.userbar-ce{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; max-width:1400px; margin:10px auto 0; padding:8px 14px; background:var(--card); border:1px solid var(--border); border-radius:8px; font-size:12.5px; color:var(--muted); }
.userbar-ce a{ color:var(--navy); text-decoration:none; font-weight:600; }
.userbar-ce .role-chip{ background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:2px 10px; margin-inline-start:6px; color:var(--text); }
.upload-note{font-size:11.5px;color:var(--muted,#666);padding:2px 10px;display:none;}
</style>
</head>
<body>

  <div id="authGate"><div class="gate-card">
    <h2 id="gateTitle">⏳ لاگ اِن کی جانچ ہو رہی ہے… / Checking sign-in…</h2>
    <p id="gateBody"></p>
    <a id="gateLink" href="index.html" style="display:none">← پورٹل پر جائیں / Go to Portal</a>
  </div></div>

  <div class="topbar">
    <div class="brand">🪶 <span data-en="Camp Office Prosecutor General Punjab — Team Chat" data-ur="کیمپ آفس پراسیکیوٹر جنرل پنجاب — ٹیم چیٹ">Camp Office Prosecutor General Punjab — Team Chat</span></div>
    <button class="lang-btn" id="langBtn" onclick="toggleLang()">اردو</button>
  </div>

  <div class="userbar-ce">
    <div><a href="index.html">← <span data-en="Portal" data-ur="پورٹل">Portal</span></a></div>
    <div><span id="ceUserEmail"></span><span class="role-chip" id="ceUserRole"></span></div>
  </div>

  <button id="chatToggleBtn" onclick="toggleChat()" title="Team Chat">💬</button>

  <div id="chatPanel">
    <div class="chat-head">
      <div class="title" data-en="Team Chat" data-ur="ٹیم چیٹ">Team Chat</div>
      <div class="close" onclick="toggleChat()">✕</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="upload-note" id="uploadNote"></div>
    <div class="chat-input-bar">
      <div class="chat-toolbar-row">
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(this)">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">📎</button>
        <button class="icon-btn" id="emojiBtn" onclick="toggleEmojiPicker(event)" title="Emoji">😊</button>
        <button class="icon-btn" id="micBtn" onclick="toggleRecording()" title="Record voice message">🎤</button>
        <div class="chat-emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="chat-main-row">
        <input type="text" id="chatInput" data-en-ph="Type a message…" data-ur-ph="پیغام لکھیں…" placeholder="Type a message…">
        <button onclick="sendMessage()" data-en="Send" data-ur="بھیجیں">Send</button>
      </div>
    </div>
  </div>

<script>
  var isUrdu = false;
  /* Team Chat — one shared chat for all staff (same "chatMessages" collection the
     other office systems already use). Files & voice notes go to Cloudinary. */
  var firebaseConfig = { apiKey: "AIzaSyCWl8dktUjAGF_JLMuZun2w3g_xnX3WBkU", authDomain: "camp-office-project.firebaseapp.com", projectId: "camp-office-project" };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var CLOUDINARY_CLOUD_NAME = "rjsudteo";
  var CLOUDINARY_UPLOAD_PRESET = "t8euf8jm";
  var CURRENT_USER = null, IS_ADMIN = false, chatMsgs = [];
  var ROLE_NAMES = { super_admin:['Super Admin','سپر ایڈمن'], admin:['Admin','ایڈمن'], data_entry:['Data Entry','ڈیٹا انٹری'], viewer:['Viewer','ناظر'] };

  function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function safeUrl(u){ return /^https:\/\//.test(String(u||'')) ? esc(u) : '#'; }

  function toggleChat(){
    document.getElementById('chatPanel').classList.toggle('open');
  }

  function bubbleContentFor(m){
    if(m.fileURL && m.fileType === 'image'){
      return '<a href="' + safeUrl(m.fileURL) + '" target="_blank" rel="noopener"><img class="chat-msg-image" src="' + safeUrl(m.fileURL) + '" alt="' + esc(m.fileName) + '"></a>';
    }
    if(m.fileURL){
      return '<a class="file-link" href="' + safeUrl(m.fileURL) + '" target="_blank" rel="noopener">' +
        '<span class="file-icon">📄</span><span>' + esc(m.fileName || 'File') + '</span></a>';
    }
    if(m.audioURL){
      return '<audio controls src="' + safeUrl(m.audioURL) + '"></audio>';
    }
    return esc(m.text);
  }

  function timeOf(m){
    var d = m.timestamp && m.timestamp.toDate ? m.timestamp.toDate() : null;
    if(!d) return '…';
    var hh = d.getHours() % 12 || 12, mm = String(d.getMinutes()).padStart(2,'0');
    var today = new Date().toDateString() === d.toDateString();
    return (today ? '' : (d.getDate() + '/' + (d.getMonth()+1) + ' ')) + hh + ':' + mm + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM');
  }

  function renderChat(){
    var box = document.getElementById('chatMessages');
    box.innerHTML = '';
    chatMsgs.forEach(function(m){
      var me = CURRENT_USER && m.senderUid === CURRENT_USER.uid;
      var div = document.createElement('div');
      div.className = 'chat-msg ' + (me ? 'me' : 'them');
      div.innerHTML =
        (IS_ADMIN ? '<div class="delete-btn" data-del="' + esc(m.id) + '" title="' + (isUrdu ? 'حذف کریں' : 'Delete') + '">✕</div>' : '') +
        (me ? '' : '<div class="sender">' + esc(m.senderName || m.senderEmail || '') + '</div>') +
        '<div class="chat-msg-bubble">' + bubbleContentFor(m) + '</div>' +
        '<div class="time">' + esc(timeOf(m)) + '</div>';
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }
  document.getElementById('chatMessages').addEventListener('click', function(ev){
    var id = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-del');
    if(id) deleteMessage(id);
  });

  function postChatMessage(extra){
    if(!CURRENT_USER) return Promise.reject(new Error('not signed in'));
    var payload = {
      senderUid: CURRENT_USER.uid,
      senderEmail: CURRENT_USER.email,
      senderName: CURRENT_USER.email.split('@')[0],
      senderRole: IS_ADMIN ? 'admin' : 'guest',
      text: '',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    Object.keys(extra || {}).forEach(function(k){ payload[k] = extra[k]; });
    return db.collection('chatMessages').add(payload);
  }

  function uploadToCloudinary(blob, name, kind, onDone){
    var note = document.getElementById('uploadNote');
    var fd = new FormData();
    fd.append('file', blob, name);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/' + kind + '/upload');
    note.style.display = 'block'; note.textContent = (isUrdu ? 'اپ لوڈ ہو رہا ہے… ' : 'Uploading… ') + '0%';
    xhr.upload.onprogress = function(ev){ if(ev.lengthComputable) note.textContent = (isUrdu ? 'اپ لوڈ ہو رہا ہے… ' : 'Uploading… ') + Math.round(ev.loaded/ev.total*100) + '%'; };
    xhr.onload = function(){
      note.style.display = 'none';
      try { var res = JSON.parse(xhr.responseText); if(res && res.secure_url){ onDone(res.secure_url); return; } } catch(e){}
      alert(isUrdu ? 'اپ لوڈ نہیں ہو سکا' : 'Upload failed');
    };
    xhr.onerror = function(){ note.style.display = 'none'; alert(isUrdu ? 'اپ لوڈ نہیں ہو سکا' : 'Upload failed'); };
    xhr.send(fd);
  }

  function handleFileUpload(input){
    if(!input.files || !input.files[0]) return;
    var file = input.files[0];
    input.value = '';
    if(file.size > 10*1024*1024){ alert(isUrdu ? 'فائل 10MB سے بڑی ہے' : 'File is larger than 10MB'); return; }
    var isImage = /^image\//.test(file.type);
    uploadToCloudinary(file, file.name, isImage ? 'image' : 'auto', function(url){
      postChatMessage({ fileURL: url, fileName: file.name, fileType: isImage ? 'image' : 'file' })
        .catch(function(err){ alert((isUrdu ? 'نہیں بھیجا جا سکا: ' : 'Could not send: ') + err.message); });
    });
  }

  var mediaRecorder = null;
  var audioChunks = [];
  var isRecording = false;

  function toggleRecording(){
    if(isRecording){
      mediaRecorder.stop();
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert(isUrdu ? 'یہ براؤزر مائیکروفون سپورٹ نہیں کرتا' : 'This browser does not support microphone recording');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e){ if(e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        var blob = new Blob(audioChunks, { type: 'audio/webm' });
        uploadToCloudinary(blob, 'voice-note.webm', 'video', function(url){
          postChatMessage({ audioURL: url }).catch(function(err){ alert((isUrdu ? 'نہیں بھیجا جا سکا: ' : 'Could not send: ') + err.message); });
        });
        stream.getTracks().forEach(function(t){ t.stop(); });
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
    }).catch(function(err){
      alert((isUrdu ? 'مائیکروفون تک رسائی نہیں ملی: ' : 'Could not access microphone: ') + err.message);
    });
  }

  var CHAT_EMOJIS = ["😀","😂","😊","😍","👍","👏","🙏","🎉","❤️","😢","😮","😡","🤔","👌","🔥","✅","❌","📌","📅","⏰","💬","☕","🙌","😴"];
  (function(){
    var picker = document.getElementById('emojiPicker');
    if(picker){
      picker.innerHTML = CHAT_EMOJIS.map(function(e){ return "<span>"+e+"</span>"; }).join("");
      picker.addEventListener('click', function(ev){
        if(ev.target.tagName === 'SPAN'){
          var input = document.getElementById('chatInput');
          input.value += ev.target.textContent;
          input.focus();
          picker.classList.remove('open');
        }
      });
      document.addEventListener('click', function(ev){
        var btn = document.getElementById('emojiBtn');
        if(picker.classList.contains('open') && ev.target !== btn && !picker.contains(ev.target)){
          picker.classList.remove('open');
        }
      });
    }
  })();
  function toggleEmojiPicker(ev){
    if(ev) ev.stopPropagation();
    document.getElementById('emojiPicker').classList.toggle('open');
  }

  function deleteMessage(id){
    if(!IS_ADMIN) return;
    if(!confirm(isUrdu ? 'یہ پیغام حذف کریں؟' : 'Delete this message?')) return;
    db.collection('chatMessages').doc(String(id)).delete()
      .catch(function(err){ alert((isUrdu ? 'حذف نہیں ہو سکا: ' : 'Could not delete: ') + err.message); });
  }

  function sendMessage(){
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    postChatMessage({ text: text }).catch(function(err){
      alert((isUrdu ? 'نہیں بھیجا جا سکا: ' : 'Could not send: ') + err.message);
      input.value = text;
    });
  }

  document.getElementById('chatInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') sendMessage();
  });

  function toggleLang(){
    isUrdu = !isUrdu;
    document.querySelectorAll('[data-en]').forEach(function(el){
      el.textContent = isUrdu ? el.dataset.ur : el.dataset.en;
    });
    document.querySelectorAll('[data-en-ph]').forEach(function(el){
      el.placeholder = isUrdu ? el.dataset.urPh : el.dataset.enPh;
    });
    document.getElementById('langBtn').textContent = isUrdu ? 'English' : 'اردو';
    document.body.setAttribute('dir', isUrdu ? 'rtl' : 'ltr');
    renderChat();
  }

  function gate(titleUr, titleEn, bodyUr, showLink){
    document.getElementById('gateTitle').textContent = titleUr + ' / ' + titleEn;
    document.getElementById('gateBody').textContent = bodyUr || '';
    document.getElementById('gateLink').style.display = showLink ? 'inline-block' : 'none';
    document.getElementById('authGate').style.display = 'flex';
  }

  auth.onAuthStateChanged(function(user){
    if(!user){
      gate('پہلے لاگ اِن کریں', 'Please sign in first', 'ٹیم چیٹ صرف منظور شدہ عملے کے لیے ہے۔ پورٹل پر جا کر لاگ اِن کریں، پھر یہاں واپس آئیں۔', true);
      return;
    }
    db.collection('users').doc(user.uid).get().then(function(doc){
      var u = doc.exists ? doc.data() : {};
      var approved = u.approvalStatus === 'approved' && u.isActive !== false;
      var legacyAdmin = u.role === 'admin';
      if(!approved && !legacyAdmin){
        gate('رسائی ابھی منظور نہیں', 'Access not approved yet', 'آپ کا اکاؤنٹ ابھی منظور نہیں ہوا یا معطل ہے۔ Administrator سے رابطہ کریں۔', true);
        return;
      }
      var r2 = u.roleV2 || (legacyAdmin ? 'admin' : 'viewer');
      CURRENT_USER = { uid: user.uid, email: user.email, role: r2 };
      IS_ADMIN = legacyAdmin || r2 === 'admin' || r2 === 'super_admin';
      document.getElementById('ceUserEmail').textContent = user.email;
      var rn = ROLE_NAMES[r2] || [r2, r2];
      document.getElementById('ceUserRole').textContent = rn[0] + ' / ' + rn[1];
      db.collection('chatMessages').orderBy('timestamp', 'desc').limit(150).onSnapshot(function(qs){
        var arr = [];
        qs.forEach(function(d){ var m = d.data(); m.id = d.id; arr.push(m); });
        chatMsgs = arr.reverse();
        renderChat();
        document.getElementById('authGate').style.display = 'none';
        document.getElementById('chatPanel').classList.add('open');
      }, function(err){
        gate('چیٹ تک رسائی نہیں', 'No access to chat', 'پیغامات لوڈ نہیں ہو سکے: ' + err.message, true);
      });
    }).catch(function(err){ gate('خرابی', 'Error', err.message, true); });
  });
