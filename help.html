<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Camp Office Portal — Help</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<style>
  :root{
    --navy:#1F4E78; --navy-dark:#153A5B; --navy-tint:#EAF0F5;
    --amber:#B8860B; --amber-tint:#FBF3DF;
    --bg:#F4F3EF; --surface:#FFFFFF; --border:#DBD7CE; --border-strong:#BEC7CE;
    --text:#22303C; --muted:#5B6B76;
    --danger:#B3261E; --danger-tint:#FBEAE9;
    --success:#2F7D4F; --success-tint:#EAF4EE;
    --warn:#8A6A12; --warn-tint:#FBEBD0;
    --radius:8px;
    --shadow:0 1px 2px rgba(21,58,91,0.08), 0 1px 1px rgba(21,58,91,0.04);
  }
  [data-theme="navy"]{ --navy:#1F4E78; --navy-dark:#153A5B; --navy-tint:#EAF0F5; --amber:#B8860B; --amber-tint:#FBF3DF; --bg:#F4F3EF; --surface:#FFFFFF; --border:#DBD7CE; --border-strong:#BEC7CE; --text:#22303C; --muted:#5B6B76; }
  [data-theme="green"]{ --navy:#0F5132; --navy-dark:#0B3B24; --navy-tint:#E7F0EA; --amber:#C9A227; --amber-tint:#FBF3D9; --bg:#F4F6F4; --surface:#FFFFFF; --border:#D9E1DB; --border-strong:#BFD1C5; --text:#1B2420; --muted:#54655B; }
  [data-theme="teal"]{ --navy:#0B7A75; --navy-dark:#075753; --navy-tint:#E3F3F2; --amber:#8A6A12; --amber-tint:#FBEBD0; --bg:#F2F7F6; --surface:#FFFFFF; --border:#D8E9E7; --border-strong:#B9D6D2; --text:#1E2A2A; --muted:#54696A; }
  [data-theme="night"]{ --navy:#1c2436; --navy-dark:#12141c; --navy-tint:#232838; --amber:#d4a13d; --amber-tint:#2a2416; --bg:#12141c; --surface:#1c2030; --border:#2a2f42; --border-strong:#3a3f55; --text:#e6e8ef; --muted:#8b93ab; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:"Segoe UI", system-ui, -apple-system, Arial, sans-serif; font-size:14px; line-height:1.6; }
  body.lang-ur, body.lang-ur input, body.lang-ur textarea, body.lang-ur select, body.lang-ur button, body.lang-ur label{ font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",Tahoma,Arial,sans-serif; }
  h1,h2,h3{ font-family:Georgia,"Times New Roman",serif; font-weight:700; margin:0; color:var(--navy-dark); }
  [data-theme="night"] h1,[data-theme="night"] h2,[data-theme="night"] h3{ color:#fff; }
  .topbar{ background:linear-gradient(180deg,var(--navy) 0%, var(--navy-dark) 100%); color:#fff; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
  .topbar .brand{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:16px; }
  .topbar select{ background:rgba(255,255,255,0.12); color:#fff; border:1px solid rgba(255,255,255,0.35); border-radius:6px; padding:6px 8px; font-size:13px; }
  .topbar select option{ color:#000; }
  .wrap{ max-width:800px; margin:0 auto; padding:20px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); box-shadow:var(--shadow); padding:20px; }
  .card + .card{ margin-top:14px; }
  label{ display:block; font-weight:600; margin:10px 0 4px; font-size:13px; color:var(--muted); }
  input[type=text],textarea{ width:100%; padding:9px 11px; border:1px solid var(--border-strong); border-radius:6px; font-size:14px; background:var(--surface); color:var(--text); font-family:inherit; }
  textarea{ min-height:80px; resize:vertical; }
  .btn{ display:inline-flex; align-items:center; gap:6px; justify-content:center; border:1px solid var(--border-strong); background:var(--surface); color:var(--text); padding:8px 13px; border-radius:6px; cursor:pointer; font-size:13px; font-weight:600; }
  .btn.primary{ background:var(--navy); border-color:var(--navy); color:#fff; }
  .btn.primary:hover{ background:var(--navy-dark); }
  .btn.danger{ background:var(--danger-tint); border-color:var(--danger); color:var(--danger); }
  .btn.small{ padding:5px 9px; font-size:12px; }
  .field-hint{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .error-box{ background:var(--danger-tint); color:var(--danger); border:1px solid var(--danger); border-radius:6px; padding:10px 12px; font-size:13px; margin-top:10px; }
  .badge{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:700; }
  .badge.super_admin{ background:#F3E6E4; color:#7A1F2B; }
  .badge.admin{ background:var(--amber-tint); color:var(--navy-dark); }
  .note-banner{ background:var(--amber-tint); border:1px solid var(--amber); border-radius:8px; padding:10px 14px; font-size:12.5px; color:var(--navy-dark); margin-bottom:16px; }
  .hidden{ display:none !important; }
  .userbar{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .backlink{ color:#fff; text-decoration:none; font-size:13px; opacity:0.9; }
  .backlink:hover{ text-decoration:underline; }
  .faq-q{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer; }
  .faq-answer{ margin-top:10px; color:var(--muted); white-space:pre-wrap; }
  .faq-actions{ display:flex; gap:6px; flex-shrink:0; margin-top:8px; }
  .add-card{ border-style:dashed; }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">❓ <span data-i18n="brandTitle">Help — Camp Office Digital Portal</span></div>
  <div style="display:flex;gap:12px;align-items:center;">
    <a class="backlink" href="index.html" data-i18n="backToHub">← Back to Hub</a>
    <select id="langSelect">
      <option value="en">English</option>
      <option value="ur">اردو</option>
    </select>
    <select id="themeSelect">
      <option value="navy">عدالتی نیلا / Navy</option>
      <option value="green">سرکاری سبز / Green</option>
      <option value="teal">جدید ٹیل / Teal</option>
      <option value="night">تاریک موڈ 🌙 / Night</option>
    </select>
  </div>
</div>

<div class="wrap">
  <div id="signedInBar" class="userbar hidden">
    <div><span data-i18n="signedInAs">Signed in as</span> <strong id="curEmail"></strong> <span id="curRoleBadge" class="badge"></span></div>
  </div>

  <h1 data-i18n="pageTitle" style="margin-bottom:14px;">Help — Guides &amp; FAQs</h1>
  <div class="note-banner hidden" id="dummyNote" data-i18n="dummyNote">ℹ️ These are placeholder/sample questions. An Administrator can add, edit, or delete them below.</div>

  <div id="faqList"></div>

  <div class="card add-card hidden" id="addCard" style="margin-top:14px;">
    <h3 data-i18n="addTitle">Add FAQ Entry</h3>
    <label data-i18n="lblQEn">Question (English)</label>
    <input type="text" id="f_q_en">
    <label data-i18n="lblQUr">Question (Urdu)</label>
    <input type="text" id="f_q_ur">
    <label data-i18n="lblAEn">Answer (English)</label>
    <textarea id="f_a_en"></textarea>
    <label data-i18n="lblAUr">Answer (Urdu)</label>
    <textarea id="f_a_ur"></textarea>
    <div id="addError" class="error-box hidden"></div>
    <div style="display:flex;gap:8px;margin-top:12px;">
      <button class="btn primary" id="btnSaveNew"><span data-i18n="btnSave">💾 Save</span></button>
      <button class="btn" id="btnCancelNew"><span data-i18n="btnCancel">Cancel</span></button>
    </div>
  </div>
  <button class="btn primary hidden" id="btnShowAdd" style="margin-top:14px;"><span data-i18n="btnAdd">➕ Add FAQ Entry</span></button>
</div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyCWl8dktUjAGF_JLMuZun2w3g_xnX3WBkU",
  authDomain: "camp-office-project.firebaseapp.com",
  projectId: "camp-office-project"
};
firebase.initializeApp(firebaseConfig);
var auth = firebase.auth();
var db = firebase.firestore();

var DUMMY_FAQS = [
  { id:null, q_en:"How do I sign up for an account?", q_ur:"اکاؤنٹ کیسے بنائیں؟",
    a_en:"Sample answer — an Administrator can edit this and add real guides here.", a_ur:"نمونے کا جواب — Administrator اسے تبدیل کر کے یہاں اصل رہنمائی شامل کر سکتے ہیں۔" },
  { id:null, q_en:"Who do I contact if I forgot my password?", q_ur:"پاس ورڈ بھول جانے کی صورت میں کس سے رابطہ کریں؟",
    a_en:"Sample answer — an Administrator can edit this and add real guides here.", a_ur:"نمونے کا جواب — Administrator اسے تبدیل کر کے یہاں اصل رہنمائی شامل کر سکتے ہیں۔" }
];

var I18N = {
  en:{
    brandTitle:"Help — Camp Office Digital Portal", backToHub:"← Back to Hub", pageTitle:"Help — Guides & FAQs",
    signedInAs:"Signed in as", dummyNote:"ℹ️ These are placeholder/sample questions. An Administrator can add, edit, or delete them below.",
    btnEdit:"✏️ Edit", btnDelete:"🗑️ Delete", btnAdd:"➕ Add FAQ Entry", addTitle:"Add FAQ Entry", editEntryTitle:"Edit FAQ Entry",
    lblQEn:"Question (English)", lblQUr:"Question (Urdu)", lblAEn:"Answer (English)", lblAUr:"Answer (Urdu)",
    btnSave:"💾 Save", btnCancel:"Cancel", confirmDelete:"Delete this FAQ entry? This cannot be undone."
  },
  ur:{
    brandTitle:"مدد — کیمپ آفس ڈیجیٹل پورٹل", backToHub:"← ہب پر واپس جائیں", pageTitle:"مدد — رہنمائی و سوالات",
    signedInAs:"لاگ اِن ہیں بطور", dummyNote:"ℹ️ یہ نمونے کے طور پر رکھے گئے سوالات ہیں۔ Administrator نیچے سے شامل، ترمیم یا حذف کر سکتے ہیں۔",
    btnEdit:"✏️ ترمیم", btnDelete:"🗑️ حذف کریں", btnAdd:"➕ سوال شامل کریں", addTitle:"سوال شامل کریں", editEntryTitle:"سوال میں ترمیم",
    lblQEn:"سوال (انگریزی)", lblQUr:"سوال (اردو)", lblAEn:"جواب (انگریزی)", lblAUr:"جواب (اردو)",
    btnSave:"💾 محفوظ کریں", btnCancel:"منسوخ کریں", confirmDelete:"یہ سوال حذف کریں؟ یہ ناقابلِ واپسی ہے۔"
  }
};
var ROLE_LABELS = { en:{ super_admin:"Super Admin", admin:"Admin" }, ur:{ super_admin:"سپر ایڈمن", admin:"ایڈمن" } };
var currentLang = "en";
var IS_ADMIN = false;
var FAQS = null;

function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

function applyI18n(){
  document.body.classList.toggle("lang-ur", currentLang==="ur");
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var key = el.getAttribute("data-i18n");
    if(I18N[currentLang][key]) el.textContent = I18N[currentLang][key];
  });
  renderList();
}
document.getElementById("langSelect").addEventListener("change", function(e){ currentLang = e.target.value; applyI18n(); });
document.getElementById("themeSelect").addEventListener("change", function(e){ document.documentElement.setAttribute("data-theme", e.target.value); });

function renderList(){
  var list = (FAQS && FAQS.length) ? FAQS : DUMMY_FAQS;
  document.getElementById("dummyNote").classList.toggle("hidden", !(!FAQS || FAQS.length===0));
  var el = document.getElementById("faqList");
  el.innerHTML = "";
  list.forEach(function(f, idx){
    var q = currentLang==="ur" ? (f.q_ur||f.q_en) : (f.q_en||f.q_ur);
    var a = currentLang==="ur" ? (f.a_ur||f.a_en) : (f.a_en||f.a_ur);
    var card = document.createElement("div");
    card.className = "card";
    var answerId = "faq-answer-"+idx;
    card.innerHTML =
      "<div class='faq-q' data-toggle='"+answerId+"'><h3>"+esc(q)+"</h3><span>▾</span></div>"+
      "<div class='faq-answer hidden' id='"+answerId+"'>"+esc(a)+"</div>"+
      (IS_ADMIN && f.id ? "<div class='faq-actions'><button class='btn small' data-edit='"+esc(f.id)+"'>"+I18N[currentLang].btnEdit+"</button><button class='btn small danger' data-delete='"+esc(f.id)+"'>"+I18N[currentLang].btnDelete+"</button></div>" : "");
    el.appendChild(card);
  });
  el.querySelectorAll("[data-toggle]").forEach(function(row){
    row.addEventListener("click", function(){
      document.getElementById(row.dataset.toggle).classList.toggle("hidden");
    });
  });
  el.querySelectorAll("[data-edit]").forEach(function(btn){
    btn.addEventListener("click", function(e){ e.stopPropagation(); openEdit(btn.dataset.edit); });
  });
  el.querySelectorAll("[data-delete]").forEach(function(btn){
    btn.addEventListener("click", function(e){ e.stopPropagation(); deleteFaq(btn.dataset.delete); });
  });
  document.getElementById("btnShowAdd").classList.toggle("hidden", !IS_ADMIN);
}

function loadFaqs(){
  db.collection("helpArticles").orderBy("createdAt","asc").get().then(function(qs){
    var rows = [];
    qs.forEach(function(d){ rows.push(Object.assign({id:d.id}, d.data())); });
    FAQS = rows;
    renderList();
  }).catch(function(){ FAQS = []; renderList(); });
}

auth.onAuthStateChanged(function(user){
  if(!user){
    IS_ADMIN = false;
    document.getElementById("signedInBar").classList.add("hidden");
    loadFaqs();
    return;
  }
  db.collection("users").doc(user.uid).get().then(function(doc){
    var data = doc.exists ? (doc.data()||{}) : {};
    var role = data.roleV2 || "viewer";
    IS_ADMIN = (role === "admin" || role === "super_admin") && data.isActive !== false && data.approvalStatus === "approved";
    document.getElementById("signedInBar").classList.remove("hidden");
    document.getElementById("curEmail").textContent = user.email;
    var badge = document.getElementById("curRoleBadge");
    badge.textContent = ROLE_LABELS[currentLang][role] || role;
    badge.className = "badge " + role;
    loadFaqs();
  }).catch(function(){ loadFaqs(); });
});

document.getElementById("btnShowAdd").addEventListener("click", function(){
  ["f_q_en","f_q_ur","f_a_en","f_a_ur"].forEach(function(id){ document.getElementById(id).value = ""; });
  document.getElementById("addError").classList.add("hidden");
  document.getElementById("addCard").dataset.editingId = "";
  document.getElementById("addCard").querySelector("h3").textContent = I18N[currentLang].addTitle;
  document.getElementById("addCard").classList.remove("hidden");
  document.getElementById("btnShowAdd").classList.add("hidden");
});
document.getElementById("btnCancelNew").addEventListener("click", function(){
  document.getElementById("addCard").classList.add("hidden");
  document.getElementById("btnShowAdd").classList.remove("hidden");
});
document.getElementById("btnSaveNew").addEventListener("click", function(){
  if(!IS_ADMIN) return;
  var errEl = document.getElementById("addError");
  errEl.classList.add("hidden");
  var payload = {
    q_en: document.getElementById("f_q_en").value.trim(),
    q_ur: document.getElementById("f_q_ur").value.trim(),
    a_en: document.getElementById("f_a_en").value.trim(),
    a_ur: document.getElementById("f_a_ur").value.trim(),
    updatedByEmail: auth.currentUser.email
  };
  if(!payload.q_en && !payload.q_ur){
    errEl.textContent = "Please enter a question in at least one language.";
    errEl.classList.remove("hidden");
    return;
  }
  var editingId = document.getElementById("addCard").dataset.editingId;
  var promise;
  if(editingId){
    promise = db.collection("helpArticles").doc(editingId).set(payload, {merge:true});
  } else {
    payload.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    promise = db.collection("helpArticles").add(payload);
  }
  promise.then(function(){
    document.getElementById("addCard").classList.add("hidden");
    document.getElementById("btnShowAdd").classList.remove("hidden");
    loadFaqs();
  }).catch(function(err){
    errEl.textContent = err.message;
    errEl.classList.remove("hidden");
  });
});

function openEdit(id){
  var f = (FAQS||[]).filter(function(x){ return x.id===id; })[0];
  if(!f) return;
  document.getElementById("f_q_en").value = f.q_en||"";
  document.getElementById("f_q_ur").value = f.q_ur||"";
  document.getElementById("f_a_en").value = f.a_en||"";
  document.getElementById("f_a_ur").value = f.a_ur||"";
  document.getElementById("addError").classList.add("hidden");
  document.getElementById("addCard").dataset.editingId = id;
  document.getElementById("addCard").querySelector("h3").textContent = I18N[currentLang].editEntryTitle;
  document.getElementById("addCard").classList.remove("hidden");
  document.getElementById("btnShowAdd").classList.add("hidden");
  document.getElementById("addCard").scrollIntoView({behavior:"smooth", block:"center"});
}

function deleteFaq(id){
  if(!IS_ADMIN) return;
  if(!confirm(I18N[currentLang].confirmDelete)) return;
  db.collection("helpArticles").doc(id).delete().then(function(){ loadFaqs(); });
}

applyI18n();
</script>
</body>
</html>
