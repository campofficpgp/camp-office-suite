<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<style>
html,body{overflow-x:hidden;}

  :root{
    --navy:#2A5A84; --navy2:#3d6f9c; --navy3:#1B3F63;
    --gold:#B8860B; --gold-light:#d4a839; --gold-deep:#8a660a;
    --bg:#F6F5F1; --card:#ffffff; --border:#E1DDD3; --text:#28394A; --muted:#647581;
    --radius-lg:10px; --radius-sm:6px; --font-head:"Segoe UI",Tahoma,Arial,sans-serif;
    --topbar-grad-angle:135deg; --accent-stripe-height:0px; --accent-stripe-color:transparent;
    --sidebar-bg:#17294a; --sidebar-bg2:#223c72; --sidebar-text:#e4e9f5; --sidebar-muted:#9caed0;
    --radius:8px;
  }

  /* Theme palettes — 7 selectable design styles (🎨 picker in the topbar), same softened
     navy/green/teal/ocean/sepia/contrast/night set used across the whole project (Dashboard /
     Weekly Court Roster / Daily Case Entry / Case Notice). Navy is the default set in :root
     above; the rest override the same tokens so every existing rule that already reads
     var(--navy)/var(--gold)/etc. re-colors and re-shapes itself. */
  body[data-theme="green"]{ /* Green */
    --navy:#1a6b45; --navy2:#2f8a5c; --navy3:#12492f;
    --gold:#C9A227; --gold-light:#ddbb52; --gold-deep:#9c7d1e;
    --bg:#F6F8F6; --card:#ffffff; --border:#DEE6E0; --text:#233229; --muted:#5E6F64;
    --radius-lg:6px; --radius-sm:5px; --font-head:"Segoe UI",Tahoma,Arial,sans-serif;
    --topbar-grad-angle:120deg;
    --sidebar-bg:#12492f; --sidebar-bg2:#1a6b45; --sidebar-text:#e8f2ec; --sidebar-muted:#a6c2b2;
  }
  body[data-theme="teal"]{ /* Teal */
    --navy:#128f89; --navy2:#26a89f; --navy3:#0c655f;
    --gold:#96762a; --gold-light:#b8934a; --gold-deep:#6f5720;
    --bg:#F4F9F8; --card:#ffffff; --border:#DCEBE9; --text:#22302F; --muted:#5C7071;
    --radius-lg:8px; --radius-sm:6px; --font-head:"Segoe UI",Tahoma,Arial,sans-serif;
    --topbar-grad-angle:110deg;
    --sidebar-bg:#0c655f; --sidebar-bg2:#128f89; --sidebar-text:#e6f4f2; --sidebar-muted:#a5cac6;
  }
  body[data-theme="ocean"]{ /* Ocean */
    --navy:#1670a0; --navy2:#2a8cc4; --navy3:#0f4a6e;
    --gold:#c9852a; --gold-light:#dba24f; --gold-deep:#9c6620;
    --bg:#F2F8FB; --card:#ffffff; --border:#D8E9F0; --text:#1A3444; --muted:#5A7E8F;
    --radius-lg:10px; --radius-sm:6px; --font-head:"Segoe UI",Tahoma,Arial,sans-serif;
    --topbar-grad-angle:130deg;
    --sidebar-bg:#0f4a6e; --sidebar-bg2:#1670a0; --sidebar-text:#e8f4fa; --sidebar-muted:#a8cfe0;
  }
  body[data-theme="sepia"]{ /* Sepia */
    --navy:#6d5330; --navy2:#8a6c40; --navy3:#4a381f;
    --gold:#a3742a; --gold-light:#c2924a; --gold-deep:#7d591f;
    --bg:#f6efe0; --card:#fcf7ee; --border:#e5d9bd; --text:#42341f; --muted:#83725a;
    --radius-lg:8px; --radius-sm:6px; --font-head:Georgia,'Times New Roman',serif;
    --topbar-grad-angle:140deg;
    --sidebar-bg:#4a381f; --sidebar-bg2:#6d5330; --sidebar-text:#f3e9d8; --sidebar-muted:#d0bd97;
  }
  body[data-theme="contrast"]{ /* High Contrast */
    --navy:#111111; --navy2:#2a2a2a; --navy3:#000000;
    --gold:#8a4b00; --gold-light:#b3661a; --gold-deep:#663700;
    --bg:#fafafa; --card:#ffffff; --border:#1a1a1a; --text:#0a0a0a; --muted:#2e2e2e;
    --radius-lg:6px; --radius-sm:4px; --font-head:"Segoe UI",Tahoma,Arial,sans-serif;
    --topbar-grad-angle:180deg;
    --sidebar-bg:#0a0a0a; --sidebar-bg2:#1a1a1a; --sidebar-text:#fafafa; --sidebar-muted:#d0d0d0;
  }
  body[data-theme="night"]{ /* Night */
    --navy:#5b7bb0; --navy2:#7292c4; --navy3:#3f5580;
    --gold:#d4a13d; --gold-light:#e0b968; --gold-deep:#a87f2c;
    --bg:#181c26; --card:#232838; --border:#333a4e; --text:#dcdfe8; --muted:#96a0b8;
    --radius-lg:8px; --radius-sm:6px; --font-head:"Segoe UI",Tahoma,Arial,sans-serif;
    --topbar-grad-angle:135deg;
    --sidebar-bg:#12151f; --sidebar-bg2:#1e2436; --sidebar-text:#dcdfe8; --sidebar-muted:#96a0b8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%;}
  body{background:var(--bg); color:var(--text); font-family:"Segoe UI",Tahoma,Arial,sans-serif; line-height:1.5;}

  .topbar{background:linear-gradient(135deg,var(--navy2),var(--navy)); color:#fff; padding:14px 22px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; position:relative; z-index:70;}
  .topbar .brand{display:flex; align-items:center; gap:10px; font-size:13px; font-weight:600;}
  /* ---- unified header parts (identical on every page) ---- */
  .topbar .right-controls{display:flex; align-items:center; gap:10px;}
  .brand-logo{width:30px; height:30px; flex-shrink:0; display:inline-flex;}
  .brand-logo svg{width:100%; height:100%; display:block;}
  .lang-btn{background:var(--gold); color:var(--navy3); border:none; padding:7px 16px; border-radius:20px; font-size:12.5px; font-weight:700; cursor:pointer;}

  .wrap{max-width:760px; margin:0 auto; padding:26px 20px 60px; min-width:0; width:100%;}
  .note-card{background:var(--card); border:1px solid var(--border); border-radius:10px; padding:16px 20px; margin-bottom:20px; font-size:13px;}
  .note-card b{color:var(--navy);}

  /* ===== Chat launcher — this dedicated Team Chat page shows the panel full-page
     and full-time (see #chatPanel below), so the floating slide-out toggle button
     that other systems use for their small chat widget has nothing to toggle here
     and is hidden, instead of floating uselessly on top of the chat. ===== */
  #chatToggleBtn{ display:none; }

  /* ===== Chat panel — on the small floating widget (other systems) this slides in
     from the right over existing page content. This page has no other content, so
     the panel instead fills the whole content area below the top bar, full width,
     all the time — no sliding, no toggle needed. */
  #chatPanel{
    position:relative; width:100%; flex:1; min-height:0; background:#fff;
    display:flex; flex-direction:column; border-left:none;
  }
  .chat-head{background:linear-gradient(135deg,var(--navy2),var(--navy)); color:#fff; padding:14px 16px; display:flex; align-items:center; justify-content:space-between;}
  .chat-head .title{font-size:13.5px; font-weight:700;}
  .chat-head .close{display:none;}

  .chat-messages{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:18px; display:flex; flex-direction:column; gap:10px; background:#faf9f5;}
  .chat-messages, .chat-input-bar{max-width:760px; width:100%; margin:0 auto;}
  .chat-msg{max-width:72%; position:relative;}
  .chat-msg.me{align-self:flex-end;}
  .chat-msg.them{align-self:flex-start;}
  .chat-msg .sender{font-size:10.5px; color:var(--gold-deep); font-weight:700; margin-bottom:2px;}
  .chat-msg .chat-msg-bubble{background:#fff; border:1px solid var(--border); border-radius:10px; padding:7px 10px; font-size:12.5px; word-break:break-word;}
  .chat-msg.me .chat-msg-bubble{background:var(--navy); color:#fff; border-color:var(--navy);}
  .chat-msg .time{font-size:9.5px; color:var(--muted); margin-top:2px;}
  .chat-msg.me .time{text-align:right;}

  /* Delete control — the piece that was missing on the live chat */
  .chat-msg .delete-btn{
    position:absolute; top:-6px; width:20px; height:20px; border-radius:50%;
    background:#fff; border:1px solid var(--border); color:#a33a3a; font-size:11px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    opacity:0; transition:opacity .12s; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .chat-msg.me .delete-btn{ left:-8px; }
  .chat-msg.them .delete-btn{ right:-8px; }
  .chat-msg:hover .delete-btn{ opacity:1; }

  .chat-input-bar{display:flex; flex-direction:column; gap:6px; padding:10px; border-top:1px solid var(--border); position:relative;}
  .chat-toolbar-row{display:flex; gap:6px; align-items:center;}
  .chat-main-row{display:flex; gap:6px; align-items:center;}
  .chat-input-bar input[type="text"]{flex:1; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius); font-size:12.5px; min-width:0;}
  .chat-input-bar button{border:none; background:var(--navy); color:#fff; border-radius:var(--radius); padding:0 14px; cursor:pointer; font-size:12.5px; font-weight:600; flex:none;}
  .chat-input-bar button:hover{background:var(--navy2);}
  .icon-btn{width:34px; height:34px; border-radius:50%; border:1px solid var(--border); background:#fff; color:var(--navy); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; padding:0 !important;}
  .icon-btn:hover{background:#f2f0e8 !important;}
  .icon-btn.recording{background:#c0392b !important; color:#fff; border-color:#c0392b; animation:pulseRec 1s infinite;}
  .chat-emoji-picker{position:absolute; left:10px; bottom:92px; display:none; grid-template-columns:repeat(8,1fr); gap:4px;
    background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 6px 20px rgba(0,0,0,.18); padding:8px;
    max-width:280px; z-index:20;}
  .chat-emoji-picker.open{display:grid;}
  .chat-emoji-picker span{cursor:pointer; font-size:18px; text-align:center; border-radius:6px; padding:2px;}
  .chat-emoji-picker span:hover{background:var(--bg);}
  @keyframes pulseRec{ 0%,100%{ box-shadow:0 0 0 0 rgba(192,57,43,.5); } 50%{ box-shadow:0 0 0 6px rgba(192,57,43,.15); } }

  .chat-msg .chat-msg-bubble a.file-link{display:flex; align-items:center; gap:7px; color:inherit; text-decoration:none;}
  .chat-msg .chat-msg-bubble .file-icon{font-size:18px;}
  .chat-msg .chat-msg-bubble .file-size{font-size:10px; opacity:.75; display:block;}
  .chat-msg .chat-msg-bubble audio{width:190px; height:30px; vertical-align:middle;}
  .chat-msg .chat-msg-bubble .chat-msg-image{max-width:200px; max-height:200px; border-radius:8px; display:block; cursor:pointer; object-fit:cover;}

  [dir="rtl"] #chatPanel{ border-left:none; }
  [dir="rtl"] .chat-msg.me{ align-self:flex-start; }
  [dir="rtl"] .chat-msg.them{ align-self:flex-end; }
  [dir="rtl"] .chat-msg.me .delete-btn{ left:auto; right:-8px; }
  [dir="rtl"] .chat-msg.them .delete-btn{ right:auto; left:-8px; }
#authGate{ position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; padding:16px; }
#authGate .gate-card{ background:var(--card); border:1px solid var(--border); border-radius:10px; padding:26px 22px; max-width:420px; width:100%; text-align:center; box-shadow:0 2px 10px rgba(0,0,0,.06); }
#authGate .gate-card h2{ margin:0 0 8px; font-size:18px; color:var(--navy); }
#authGate .gate-card p{ color:var(--muted); font-size:13.5px; line-height:1.7; margin:6px 0; }
#authGate .gate-card a{ display:inline-block; margin-top:12px; background:var(--navy); color:#fff; padding:9px 18px; border-radius:6px; text-decoration:none; font-size:13.5px; }
.userbar-ce{ display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; max-width:1400px; margin:10px auto 0; padding:8px 14px; background:var(--card); border:1px solid var(--border); border-radius:8px; font-size:12.5px; color:var(--muted); }
.userbar-ce a{ color:var(--navy); text-decoration:none; font-weight:600; }
.userbar-ce .role-chip{ background:var(--bg); border:1px solid var(--border); border-radius:20px; padding:2px 10px; margin-inline-start:6px; color:var(--text); }
/* .user-chip-sm below is designed for the dark navy topbar (white text on a faint
   white tint). Nested here inside .userbar-ce's white card, that would be invisible
   white-on-white text — this override keeps it readable on the light background. */
.userbar-ce .user-chip-sm{ color:var(--text); background:var(--bg); border-color:var(--border); }
.userbar-ce .user-chip-sm .role-chip{ background:var(--card); color:var(--text); }
.upload-note{font-size:11.5px;color:var(--muted,#666);padding:2px 10px;display:none;}

  /* ================= New shared dashboard shell (sidebar + topbar2) ================= */
  .app-shell{ display:flex; min-height:100vh; }
  .sidebar{ width:230px; flex:none; background:linear-gradient(180deg,var(--sidebar-bg2) 0%, var(--sidebar-bg) 100%); color:var(--sidebar-text); display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto; transition:width .18s ease, transform .18s ease; z-index:40; }
  .sidebar-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 12px; border-bottom:1px solid rgba(255,255,255,0.12); }
  .sidebar-brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:13.5px; }
  .sidebar-collapse-btn{ background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:var(--sidebar-text); width:28px; height:28px; border-radius:6px; cursor:pointer; font-size:13px; flex:none; }
  .sidebar-nav{ padding:8px 7px; flex:1; }
  .nav-item, .nav-group-head{ display:flex; align-items:center; gap:9px; width:100%; padding:9px 9px; border-radius:7px; color:var(--sidebar-text); text-decoration:none; font-size:12.5px; font-weight:600; background:none; border:none; cursor:pointer; text-align:left; margin-bottom:2px; font-family:var(--font-head); }
  .nav-item:hover, .nav-group-head:hover{ background:rgba(255,255,255,0.09); }
  .nav-item.active{ background:rgba(255,255,255,0.16); }
  .nav-item .ico, .nav-group-head .ico{ width:18px; text-align:center; flex:none; }
  .nav-group-head .chev{ margin-left:auto; transition:transform .15s; font-size:11px; }
  .nav-group.open .nav-group-head .chev{ transform:rotate(90deg); }
  .nav-submenu{ max-height:0; overflow:hidden; transition:max-height .18s ease; padding-left:12px; }
  .nav-group.open .nav-submenu{ max-height:220px; }
  .nav-subitem{ display:flex; align-items:center; gap:8px; padding:7px 9px; font-size:12px; color:var(--sidebar-muted); text-decoration:none; border-radius:6px; cursor:pointer; background:none; border:none; width:100%; text-align:left; font-family:inherit; }
  .nav-subitem:hover, .nav-subitem.active{ background:rgba(255,255,255,0.09); color:var(--sidebar-text); }
  .sidebar-foot{ border-top:1px solid rgba(255,255,255,0.12); padding:8px 7px 14px; display:flex; flex-direction:column; gap:2px; }
  .sidebar-foot a{ display:flex; align-items:center; gap:9px; padding:7px 9px; border-radius:7px; color:var(--sidebar-muted); text-decoration:none; font-size:11.5px; }
  .sidebar-foot a:hover{ background:rgba(255,255,255,0.08); color:var(--sidebar-text); }
  .sidebar-foot a.active{ background:rgba(255,255,255,0.16); color:var(--sidebar-text); }
  .sidebar-backdrop{ display:none; }
  .main-col{ flex:1; min-width:0; display:flex; flex-direction:column; }
  .topbar2{ display:flex; align-items:center; gap:12px; }
  .topbar2 .brand{ display:flex; align-items:center; gap:8px; }
  .mobile-menu-btn{ display:none; background:none; border:1px solid rgba(255,255,255,0.35); color:#fff; border-radius:6px; width:32px; height:32px; cursor:pointer; font-size:14px; flex:none; }
  .topbar-logo-sm{ height:30px; width:auto; display:block; filter:drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .user-chip-sm{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:#fff; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.25); border-radius:20px; padding:5px 12px; white-space:nowrap; }
  .user-chip-sm .role-chip{ background:rgba(255,255,255,0.18); border:none; color:#fff; }
  @media (max-width: 960px){
    .sidebar{ position:fixed; top:0; bottom:0; left:0; transform:translateX(-102%); width:230px; box-shadow:0 0 30px rgba(0,0,0,0.3); }
    [dir="rtl"] .sidebar{ left:auto; right:0; transform:translateX(102%); }
    .sidebar.mobile-open{ transform:translateX(0); }
    .mobile-menu-btn{ display:inline-block; }
    .sidebar-backdrop.show{ display:block; position:fixed; inset:0; background:rgba(10,14,26,0.45); z-index:39; }
    .topbar2{ flex-wrap:wrap; }
    .user-chip-sm{ display:none; }
  }

  /* ================= Theme picker (added — page had no theme system before) ================= */
  .theme-switch-wrap{ position:relative; }
  .theme-btn{ background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.32); color:#fff; padding:6px 11px; border-radius:20px; font-size:14px; cursor:pointer; line-height:1; }
  .theme-btn:hover{ background:rgba(255,255,255,.24); }
  .theme-picker{ position:absolute; top:calc(100% + 8px); right:0; background:#fff; border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.28); padding:10px; display:none; flex-wrap:wrap; gap:8px; width:170px; z-index:60; }
  [dir="rtl"] .theme-picker{ right:auto; left:0; }
  .theme-picker.open{ display:flex; }
  .theme-swatch{ width:34px; height:34px; border-radius:50%; cursor:pointer; border:2px solid transparent; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); }
  .theme-swatch:hover{ transform:scale(1.08); }
  .theme-swatch.active{ border-color:var(--navy); box-shadow:0 0 0 2px var(--gold); }

</style>
</head>

  </div>

  <div class="userbar-ce">
    <div class="user-chip-sm"><span id="ceUserEmail"></span><span class="role-chip" id="ceUserRole"></span></div>
  </div>
<button id="chatToggleBtn" onclick="toggleChat()" title="Team Chat">💬</button>

  <div id="chatPanel">
    <div class="chat-head">
      <div class="title" data-en="Team Chat" data-ur="ٹیم چیٹ">Team Chat</div>
      <div class="close" onclick="toggleChat()">✕</div>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="upload-note" id="uploadNote"></div>
    <div class="chat-input-bar">
      <div class="chat-toolbar-row">
        <input type="file" id="fileInput" style="display:none;" onchange="handleFileUpload(this)">
        <button class="icon-btn" onclick="document.getElementById('fileInput').click()" title="Attach file">📎</button>
        <button class="icon-btn" id="emojiBtn" onclick="toggleEmojiPicker(event)" title="Emoji">😊</button>
        <button class="icon-btn" id="micBtn" onclick="toggleRecording()" title="Record voice message">🎤</button>
        <div class="chat-emoji-picker" id="emojiPicker"></div>
      </div>
      <div class="chat-main-row">
        <input type="text" id="chatInput" data-en-ph="Type a message…" data-ur-ph="پیغام لکھیں…" placeholder="Type a message…">
        <button onclick="sendMessage()" data-en="Send" data-ur="بھیجیں">Send</button>
      </div>
    </div>
  </div>

<script>
  var THEMES = [
    { id:'navy', nameEn:'Navy', nameUr:'نیلا', navy:'#2A5A84', gold:'#B8860B' },
    { id:'green', nameEn:'Green', nameUr:'سبز', navy:'#1a6b45', gold:'#C9A227' },
    { id:'teal', nameEn:'Teal', nameUr:'ٹیل', navy:'#128f89', gold:'#96762a' },
    { id:'ocean', nameEn:'Ocean', nameUr:'سمندری', navy:'#1670a0', gold:'#c9852a' },
    { id:'sepia', nameEn:'Sepia', nameUr:'بھورا', navy:'#6d5330', gold:'#a3742a' },
    { id:'contrast', nameEn:'Contrast', nameUr:'کنٹراسٹ', navy:'#111111', gold:'#8a4b00' },
    { id:'night', nameEn:'Night', nameUr:'تاریک', navy:'#5b7bb0', gold:'#d4a13d' }
  ];
  var currentTheme = (function(){ try{ return localStorage.getItem('cmpTheme') || 'navy'; }catch(e){ return 'navy'; } })();
  function renderThemePicker(){
    var box = document.getElementById('themePicker');
    if(!box) return;
    box.innerHTML = THEMES.map(function(t){
      var active = (t.id === currentTheme) ? ' active' : '';
      var label = (typeof isUrdu !== 'undefined' && isUrdu) ? t.nameUr : t.nameEn;
      return '<div class="theme-swatch'+active+'" data-theme-id="'+t.id+'" title="'+label+'" ' +
        'style="background:linear-gradient(135deg,'+t.gold+' 50%,'+t.navy+' 50%);"></div>';
    }).join('');
  }
  function toggleThemePicker(){
    var el = document.getElementById('themePicker');
    if(el) el.classList.toggle('open');
  }
  function setTheme(id){
    currentTheme = id;
    document.body.setAttribute('data-theme', id);
    try{ localStorage.setItem('cmpTheme', id); }catch(e){}
    renderThemePicker();
    var picker = document.getElementById('themePicker');
    if(picker) picker.classList.remove('open');
  }
  (function(){
    var tp = document.getElementById('themePicker');
    if(tp) tp.addEventListener('click', function(e){
      var sw = e.target.closest('.theme-swatch');
      if(sw) setTheme(sw.dataset.themeId);
    });
    document.addEventListener('click', function(e){
      var wrap = document.querySelector('.theme-switch-wrap');
      if(wrap && !wrap.contains(e.target)){ var p = document.getElementById('themePicker'); if(p) p.classList.remove('open'); }
    });
    document.body.setAttribute('data-theme', currentTheme);
    renderThemePicker();
  })();

  var isUrdu = false;

  /* ================= Shared sidebar / mobile-drawer interactivity ================= */
  (function(){
    var sidebarEl = document.getElementById('sidebar');
    var backdrop = document.getElementById('sidebarBackdrop');
    var mobileBtn = document.getElementById('mobileMenuBtn');
    if(mobileBtn) mobileBtn.addEventListener('click', function(){
      sidebarEl.classList.add('mobile-open'); backdrop.classList.add('show');
    });
    if(backdrop) backdrop.addEventListener('click', function(){
      sidebarEl.classList.remove('mobile-open'); backdrop.classList.remove('show');
    });
    document.querySelectorAll('.nav-group-head').forEach(function(btn){
      btn.addEventListener('click', function(){
        document.getElementById(btn.dataset.group).classList.toggle('open');
      });
    });
    document.querySelectorAll('.sidebar .nav-item:not(.disabled), .sidebar .nav-subitem').forEach(function(el){
      el.addEventListener('click', function(){
        if(window.innerWidth <= 960){ sidebarEl.classList.remove('mobile-open'); backdrop.classList.remove('show'); }
      });
    });
  })();

  /* Team Chat — one shared chat for all staff (same "chatMessages" collection the
     other office systems already use). Files & voice notes go to Cloudinary. */
  var firebaseConfig = { apiKey: "AIzaSyCWl8dktUjAGF_JLMuZun2w3g_xnX3WBkU", authDomain: "camp-office-project.firebaseapp.com", projectId: "camp-office-project" };
  firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db = firebase.firestore();
  var CLOUDINARY_CLOUD_NAME = "rjsudteo";
  var CLOUDINARY_UPLOAD_PRESET = "t8euf8jm";
  var CURRENT_USER = null, IS_ADMIN = false, chatMsgs = [];
  var ROLE_NAMES = { super_admin:['Super Admin','سپر ایڈمن'], admin:['Admin','ایڈمن'], data_entry:['Data Entry','ڈیٹا انٹری'], viewer:['Viewer','ناظر'] };

  function esc(v){ return String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function safeUrl(u){ return /^https:\/\//.test(String(u||'')) ? esc(u) : '#'; }

  function toggleChat(){
    document.getElementById('chatPanel').classList.toggle('open');
  }

  function bubbleContentFor(m){
    if(m.fileURL && m.fileType === 'image'){
      return '<a href="' + safeUrl(m.fileURL) + '" target="_blank" rel="noopener"><img class="chat-msg-image" src="' + safeUrl(m.fileURL) + '" alt="' + esc(m.fileName) + '"></a>';
    }
    if(m.fileURL){
      return '<a class="file-link" href="' + safeUrl(m.fileURL) + '" target="_blank" rel="noopener">' +
        '<span class="file-icon">📄</span><span>' + esc(m.fileName || 'File') + '</span></a>';
    }
    if(m.audioURL){
      return '<audio controls src="' + safeUrl(m.audioURL) + '"></audio>';
    }
    return esc(m.text);
  }

  function timeOf(m){
    var d = m.timestamp && m.timestamp.toDate ? m.timestamp.toDate() : null;
    if(!d) return '…';
    var hh = d.getHours() % 12 || 12, mm = String(d.getMinutes()).padStart(2,'0');
    var today = new Date().toDateString() === d.toDateString();
    return (today ? '' : (d.getDate() + '/' + (d.getMonth()+1) + ' ')) + hh + ':' + mm + ' ' + (d.getHours() >= 12 ? 'PM' : 'AM');
  }

  function renderChat(){
    var box = document.getElementById('chatMessages');
    box.innerHTML = '';
    chatMsgs.forEach(function(m){
      var me = CURRENT_USER && m.senderUid === CURRENT_USER.uid;
      var div = document.createElement('div');
      div.className = 'chat-msg ' + (me ? 'me' : 'them');
      div.innerHTML =
        (IS_ADMIN ? '<div class="delete-btn" data-del="' + esc(m.id) + '" title="' + (isUrdu ? 'حذف کریں' : 'Delete') + '">✕</div>' : '') +
        (me ? '' : '<div class="sender">' + esc(m.senderName || m.senderEmail || '') + '</div>') +
        '<div class="chat-msg-bubble">' + bubbleContentFor(m) + '</div>' +
        '<div class="time">' + esc(timeOf(m)) + '</div>';
      box.appendChild(div);
    });
    box.scrollTop = box.scrollHeight;
  }
  document.getElementById('chatMessages').addEventListener('click', function(ev){
    var id = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-del');
    if(id) deleteMessage(id);
  });

  function postChatMessage(extra){
    if(!CURRENT_USER) return Promise.reject(new Error('not signed in'));
    var payload = {
      senderUid: CURRENT_USER.uid,
      senderEmail: CURRENT_USER.email,
      senderName: CURRENT_USER.email.split('@')[0],
      senderRole: IS_ADMIN ? 'admin' : 'guest',
      text: '',
      timestamp: firebase.firestore.FieldValue.serverTimestamp()
    };
    Object.keys(extra || {}).forEach(function(k){ payload[k] = extra[k]; });
    return db.collection('chatMessages').add(payload);
  }

  function uploadToCloudinary(blob, name, kind, onDone){
    var note = document.getElementById('uploadNote');
    var fd = new FormData();
    fd.append('file', blob, name);
    fd.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
    var xhr = new XMLHttpRequest();
    xhr.open('POST', 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CLOUD_NAME + '/' + kind + '/upload');
    note.style.display = 'block'; note.textContent = (isUrdu ? 'اپ لوڈ ہو رہا ہے… ' : 'Uploading… ') + '0%';
    xhr.upload.onprogress = function(ev){ if(ev.lengthComputable) note.textContent = (isUrdu ? 'اپ لوڈ ہو رہا ہے… ' : 'Uploading… ') + Math.round(ev.loaded/ev.total*100) + '%'; };
    xhr.onload = function(){
      note.style.display = 'none';
      try { var res = JSON.parse(xhr.responseText); if(res && res.secure_url){ onDone(res.secure_url); return; } } catch(e){}
      alert(isUrdu ? 'اپ لوڈ نہیں ہو سکا' : 'Upload failed');
    };
    xhr.onerror = function(){ note.style.display = 'none'; alert(isUrdu ? 'اپ لوڈ نہیں ہو سکا' : 'Upload failed'); };
    xhr.send(fd);
  }

  function handleFileUpload(input){
    if(!input.files || !input.files[0]) return;
    var file = input.files[0];
    input.value = '';
    if(file.size > 10*1024*1024){ alert(isUrdu ? 'فائل 10MB سے بڑی ہے' : 'File is larger than 10MB'); return; }
    var isImage = /^image\//.test(file.type);
    uploadToCloudinary(file, file.name, isImage ? 'image' : 'auto', function(url){
      postChatMessage({ fileURL: url, fileName: file.name, fileType: isImage ? 'image' : 'file' })
        .catch(function(err){ alert((isUrdu ? 'نہیں بھیجا جا سکا: ' : 'Could not send: ') + err.message); });
    });
  }

  var mediaRecorder = null;
  var audioChunks = [];
  var isRecording = false;

  function toggleRecording(){
    if(isRecording){
      mediaRecorder.stop();
      return;
    }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert(isUrdu ? 'یہ براؤزر مائیکروفون سپورٹ نہیں کرتا' : 'This browser does not support microphone recording');
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e){ if(e.data.size > 0) audioChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        var blob = new Blob(audioChunks, { type: 'audio/webm' });
        uploadToCloudinary(blob, 'voice-note.webm', 'video', function(url){
          postChatMessage({ audioURL: url }).catch(function(err){ alert((isUrdu ? 'نہیں بھیجا جا سکا: ' : 'Could not send: ') + err.message); });
        });
        stream.getTracks().forEach(function(t){ t.stop(); });
        isRecording = false;
        document.getElementById('micBtn').classList.remove('recording');
      };
      mediaRecorder.start();
      isRecording = true;
      document.getElementById('micBtn').classList.add('recording');
    }).catch(function(err){
      alert((isUrdu ? 'مائیکروفون تک رسائی نہیں ملی: ' : 'Could not access microphone: ') + err.message);
    });
  }

  var CHAT_EMOJIS = ["😀","😂","😊","😍","👍","👏","🙏","🎉","❤️","😢","😮","😡","🤔","👌","🔥","✅","❌","📌","📅","⏰","💬","☕","🙌","😴"];
  (function(){
    var picker = document.getElementById('emojiPicker');
    if(picker){
      picker.innerHTML = CHAT_EMOJIS.map(function(e){ return "<span>"+e+"</span>"; }).join("");
      picker.addEventListener('click', function(ev){
        if(ev.target.tagName === 'SPAN'){
          var input = document.getElementById('chatInput');
          input.value += ev.target.textContent;
          input.focus();
          picker.classList.remove('open');
        }
      });
      document.addEventListener('click', function(ev){
        var btn = document.getElementById('emojiBtn');
        if(picker.classList.contains('open') && ev.target !== btn && !picker.contains(ev.target)){
          picker.classList.remove('open');
        }
      });
    }
  })();
  function toggleEmojiPicker(ev){
    if(ev) ev.stopPropagation();
    document.getElementById('emojiPicker').classList.toggle('open');
  }

  function deleteMessage(id){
    if(!IS_ADMIN) return;
    if(!confirm(isUrdu ? 'یہ پیغام حذف کریں؟' : 'Delete this message?')) return;
    db.collection('chatMessages').doc(String(id)).delete()
      .catch(function(err){ alert((isUrdu ? 'حذف نہیں ہو سکا: ' : 'Could not delete: ') + err.message); });
  }

  function sendMessage(){
    var input = document.getElementById('chatInput');
    var text = input.value.trim();
    if(!text) return;
    input.value = '';
    postChatMessage({ text: text }).catch(function(err){
      alert((isUrdu ? 'نہیں بھیجا جا سکا: ' : 'Could not send: ') + err.message);
      input.value = text;
    });
  }

  document.getElementById('chatInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') sendMessage();
  });

  function toggleLang(){
    isUrdu = !isUrdu;
    document.querySelectorAll('[data-en]').forEach(function(el){
      el.textContent = isUrdu ? el.dataset.ur : el.dataset.en;
    });
    document.querySelectorAll('[data-en-ph]').forEach(function(el){
      el.placeholder = isUrdu ? el.dataset.urPh : el.dataset.enPh;
    });
    document.getElementById('langBtn').textContent = isUrdu ? 'English' : 'اردو';
    document.body.setAttribute('dir', isUrdu ? 'rtl' : 'ltr');
    renderThemePicker();
    renderChat();
  }

  function gate(titleUr, titleEn, bodyUr, showLink){
    document.getElementById('gateTitle').textContent = titleUr + ' / ' + titleEn;
    document.getElementById('gateBody').textContent = bodyUr || '';
    document.getElementById('gateLink').style.display = showLink ? 'inline-block' : 'none';
    document.getElementById('authGate').style.display = 'flex';
  }

  auth.onAuthStateChanged(function(user){
    if(!user){
      gate('پہلے لاگ اِن کریں', 'Please sign in first', 'ٹیم چیٹ صرف منظور شدہ عملے کے لیے ہے۔ پورٹل پر جا کر لاگ اِن کریں، پھر یہاں واپس آئیں۔', true);
      return;
    }
    db.collection('users').doc(user.uid).get().then(function(doc){
      var u = doc.exists ? doc.data() : {};
      var approved = u.approvalStatus === 'approved' && u.isActive !== false;
      var legacyAdmin = u.role === 'admin';
      if(!approved && !legacyAdmin){
        gate('رسائی ابھی منظور نہیں', 'Access not approved yet', 'آپ کا اکاؤنٹ ابھی منظور نہیں ہوا یا معطل ہے۔ Administrator سے رابطہ کریں۔', true);
        return;
      }
      var r2 = u.roleV2 || (legacyAdmin ? 'admin' : 'viewer');
      CURRENT_USER = { uid: user.uid, email: user.email, role: r2 };
      IS_ADMIN = legacyAdmin || r2 === 'admin' || r2 === 'super_admin';
      document.getElementById('ceUserEmail').textContent = user.email;
      var rn = ROLE_NAMES[r2] || [r2, r2];
      document.getElementById('ceUserRole').textContent = rn[0] + ' / ' + rn[1];
      db.collection('chatMessages').orderBy('timestamp', 'desc').limit(150).onSnapshot(function(qs){
        var arr = [];
        qs.forEach(function(d){ var m = d.data(); m.id = d.id; arr.push(m); });
        chatMsgs = arr.reverse();
        renderChat();
        document.getElementById('authGate').style.display = 'none';
        document.getElementById('chatPanel').classList.add('open');
      }, function(err){
        gate('چیٹ تک رسائی نہیں', 'No access to chat', 'پیغامات لوڈ نہیں ہو سکے: ' + err.message, true);
      });
    }).catch(function(err){ gate('خرابی', 'Error', err.message, true); });
  });
</script>
    </div><!-- /.main-col -->
  </div><!-- /.app-shell -->
